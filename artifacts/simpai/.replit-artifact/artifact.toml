kind = "web"
previewPath = "/"
title = "SIM-PAI SEDJATI"
version = "1.0.0"
id = "artifacts/simpai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22453

[services.development]
run = "pnpm --filter @workspace/simpai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/simpai", "run", "build" ]
publicDir = "artifacts/simpai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22453"
BASE_PATH = "/"
